<!DOCTYPE html>
<html>
<head>
<title>Graph Widget</title>
<script type="application/ld+json">
{
  "@context": "https://schema.org/",
  "@graph": [
    {
      "@type": "WebPage",
      "name": "Graph Widget Page"
    },
    {
      "@type": "Product",
      "name": "Graph Widget",
      "image": ["https://shop.example.com/img/graph1.jpg", "https://shop.example.com/img/graph2.jpg"],
      "offers": {
        "@type": "Offer",
        "price": 89.5,
        "priceCurrency": "EUR",
        "availability": "https://schema.org/InStock"
      }
    }
  ]
}
</script>
</head>
<body></body>
</html>
